<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NEO</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  #caja {
    position: fixed; top: 18px; left: 10px; right: 10px;
    padding: 10px 12px 12px;
    border-left: 3px solid #00e5ff;
    background: rgba(0,20,30,0.18);
    animation: entra .35s ease-out;
  }
  #et {
    color: #7dffb2; font-size: 13px; letter-spacing: 5px;
    text-shadow: 0 0 10px rgba(125,255,178,.9), 0 1px 3px #000;
    margin-bottom: 6px;
  }
  #t {
    color: #f2ffff; font-size: 25px; line-height: 1.28;
    letter-spacing: .5px;
    text-shadow: 0 0 14px rgba(0,229,255,.85), 0 2px 8px #000;
    word-wrap: break-word;
  }
  @keyframes entra { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
</style>
<div id="caja">
  <div id="et">NEO</div>
  <div id="t"></div>
</div>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var texto = (p.get("a") || "").trim();
    document.getElementById("t").textContent = texto;
    try {
      var u = new SpeechSynthesisUtterance(texto);
      u.lang = "es-ES"; u.rate = 1.0; u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  })();
</script>
</html>
