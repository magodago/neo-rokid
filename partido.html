<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEO PARTIDO</title>
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%}
#w{position:fixed;top:0;left:0;right:0;padding:12px 14px 10px;
font-family:Roboto,-apple-system,sans-serif;color:#7dffb2}
#sc{font-size:27px;font-weight:700;letter-spacing:.5px;line-height:1}
#sc i{font-style:normal;font-size:14px;opacity:.8;margin-left:9px}
#pb{height:4px;background:rgba(125,255,178,.15);margin:9px 0 4px;border-radius:3px;overflow:hidden}
#pb b{display:block;height:100%;background:#7dffb2}
#pp{display:flex;justify-content:space-between;font-size:11px;opacity:.72}
#st{font-size:12px;opacity:.72;margin-top:6px}
#xg{font-size:12px;opacity:.72;margin-top:3px}
#mb{position:relative;height:3px;background:rgba(125,255,178,.15);margin:10px 0 3px;border-radius:2px}
#mb b{position:absolute;top:0;height:100%;background:#7dffb2;border-radius:2px}
#mbt{font-size:10.5px;opacity:.6;letter-spacing:.6px}
#gl{margin-top:10px;font-size:12.5px;line-height:1.55}
#gl s{text-decoration:none;opacity:.55;font-size:11px}
#tp{margin-top:10px;font-size:12px;opacity:.85}
#ds,#ps{font-size:11.5px;opacity:.72;margin-top:2px;letter-spacing:.3px;white-space:nowrap}
#vid{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000;z-index:60}
#vid video{width:100vw;height:auto;max-height:100vh;background:#000}
#fw{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none}
#gol{position:fixed;left:0;right:0;top:52%;text-align:center;color:#7dffb2;opacity:0;transition:opacity .3s}
#gol.on{opacity:1}
#gol u{display:block;text-decoration:none;font-size:54px;font-weight:800;letter-spacing:4px;
text-shadow:0 0 20px rgba(125,255,178,.9),0 0 46px rgba(125,255,178,.5);animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
#gol v{display:block;text-decoration:none;font-size:23px;font-weight:600;margin-top:8px;
text-shadow:0 0 16px rgba(125,255,178,.8);animation:pop .6s .08s both}
#gol w{display:block;text-decoration:none;font-size:12px;opacity:.75;margin-top:6px;letter-spacing:2px;
animation:pop .6s .16s both}
@keyframes pop{0%{transform:scale(.55);opacity:0}60%{transform:scale(1.07);opacity:1}100%{transform:scale(1);opacity:1}}
</style></head><body>
<div id="w">
<div id="sc">NEO</div>
<div id="pb"><b></b></div>
<div id="pp"><span></span><span></span></div>
<div id="st"></div>
<div id="xg"></div><div id="ds"></div><div id="ps"></div>
<div id="mb"><b></b></div>
<div id="mbt"></div>
<div id="gl"></div>
<div id="tp"></div>
</div>
<div id="vid"><video id="v" playsinline controls></video></div><canvas id="fw"></canvas>
<div id="gol"><u>GOL</u><v></v><w></w></div>
<script>
var DEMO=/demo=1/.test(location.search),FORCE=/force=1/.test(location.search),lastG=-1;
function demoObj(){return {ok:true,state:"in",min:"67'",h:"BAR",a:"RMA",hs:"1",as:"2",
pos:["58","42"],tiros:[12,9],apuerta:[5,6],corners:[4,3],xg:[1.42,1.87],mom:-0.38,
goles:[{m:"12'",t:"Vinicius Jr. · RMA"},{m:"34'",t:"Lewandowski · BAR"},{m:"58'",t:"Mbappé · RMA"}],
fig:["Mbappé 8.4","Vinicius 7.9","Pedri 7.4"]};}
var fw=document.getElementById("fw"),fx=fw.getContext("2d"),parts=[],anim=0,tEnd=0;
function size(){fw.width=innerWidth;fw.height=innerHeight;}
size();addEventListener("resize",size);
function boom(cx,cy){
 var col=["#7dffb2","#b9ffd4","#ffd166","#63e6ff"][Math.floor(Math.random()*4)];
 for(var i=0;i<70;i++){var a=Math.random()*6.2833,s=1+Math.random()*4.2;
  parts.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:col,r:.9+Math.random()*1.6});}
}
function fwloop(){
 fx.clearRect(0,0,fw.width,fw.height);
 if(!parts.length){anim=0;return;}
 fx.globalCompositeOperation="lighter";
 for(var i=parts.length-1;i>=0;i--){var p=parts[i];
  p.vy+=0.055;p.vx*=0.987;p.vy*=0.987;p.x+=p.vx;p.y+=p.vy;p.l-=0.011;
  if(p.l<=0||p.y>fw.height+20){parts.splice(i,1);continue;}
  fx.strokeStyle=p.c;fx.globalAlpha=Math.max(0,p.l);fx.lineWidth=p.r;
  fx.beginPath();fx.moveTo(p.x-p.vx*2.2,p.y-p.vy*2.2);fx.lineTo(p.x,p.y);fx.stroke();}
 fx.globalAlpha=1;requestAnimationFrame(fwloop);}
var CLIP="",CT=0,VAB=false;
function armar(u){if(!u)return;CLIP=u;CT=Date.now();}
function cele(g){
 var box=document.getElementById("gol");
 box.querySelector("v").textContent=g.t||"GOL";
 box.querySelector("w").textContent=(g.m||"")+"  GOL DEL REAL MADRID  ·  toca la patilla para verla";
 box.classList.add("on");
 var t0=Date.now();
 (function shoot(){
  boom(innerWidth*(0.18+Math.random()*0.64),innerHeight*(0.10+Math.random()*0.38));
  if(Date.now()-t0<5200)setTimeout(shoot,420);
 })();
 setTimeout(function(){box.classList.remove("on");},7200);
 if(!anim){anim=1;requestAnimationFrame(fwloop);}
}
function grito(n,rm){
 try{
  var a=new Audio("gol.wav?rm="+(rm?1:0)+"&n="+encodeURIComponent(n||"")+"&t="+Date.now());
  a.volume=1;a.play().catch(function(){});
 }catch(e){}
}
function bannerRival(eq,m,sc){
 var box=document.getElementById("gol");
 box.querySelector("u").textContent="GOL";
 box.querySelector("u").style.fontSize="40px";
 box.querySelector("u").style.color="#ff6b6b";
 box.querySelector("v").textContent=eq||"Rival";
 box.querySelector("w").textContent=(m?m+"  ·  ":"")+(sc?sc+"  ·  ":"")+"GOL DEL RIVAL";
 box.classList.add("on");
 ocultar();
 setTimeout(function(){box.classList.remove("on");box.querySelector("u").style.fontSize="54px";box.querySelector("u").style.color="#7dffb2";},10000);
}
function golRival(eq,m){
 var box=document.getElementById("gol");
 box.querySelector("u").textContent="GOL";
 box.querySelector("u").style.fontSize="34px";
 box.querySelector("v").textContent=eq||"Rival";
 box.querySelector("w").textContent=(m+"  ·  GOL DEL RIVAL");
 box.classList.add("on");
 setTimeout(function(){box.classList.remove("on");box.querySelector("u").style.fontSize="54px";},4500);
}
function pinta(o){
var sc=document.getElementById("sc"),pb=document.querySelector("#pb b"),
pp=document.getElementById("pp"),st=document.getElementById("st"),xg=document.getElementById("xg"),
gl=document.getElementById("gl"),tp=document.getElementById("tp"),
mbb=document.querySelector("#mb b"),mbt=document.getElementById("mbt");
if(!o||!o.ok){
 if(o&&o.prox){sc.innerHTML="PRÓXIMO<i>"+o.proxf+"</i>";
  gl.innerHTML="<div>"+String(o.prox).replace(" at "," – ")+"</div>";}
 else{sc.innerHTML="SIN PARTIDO";gl.innerHTML="";}
 st.textContent="";xg.textContent="";tp.textContent="";mbt.textContent="";mbb.style.width="0%";return;}
if(o.state==="pre"){
 sc.innerHTML=o.h+"  –  "+o.a+"<i>"+(o.hora||"")+"</i>";
 ["pb","pp","st","xg","mb","mbt"].forEach(function(k){var e=document.getElementById(k);if(e)e.style.display="none";});
 gl.innerHTML="<div>Arranca a las "+(o.hora||"")+"</div>";
 tp.textContent="";return;
}
["pb","pp","st","xg","mb","mbt"].forEach(function(k){var e=document.getElementById(k);if(e)e.style.display="";});
var min=o.state==="post"?"FINAL":(o.state==="pre"?"PREVIO":(o.min||o.det||""));
sc.innerHTML=o.h+" "+o.hs+" - "+o.as+" "+o.a+"<i>"+min+"</i>";
var p1=parseFloat(o.pos[0]);if(isNaN(p1))p1=50;
pb.style.width=p1+"%";
pp.children[0].textContent=o.h+"  "+o.pos[0]+"%";
pp.children[1].textContent=o.pos[1]+"%  "+o.a;
st.textContent="Tiros "+o.tiros[0]+"-"+o.tiros[1]+"   ·   A puerta "+o.apuerta[0]+"-"+o.apuerta[1]+"   ·   Córners "+o.corners[0]+"-"+o.corners[1];
if(o.xg)xg.textContent="Peligro  xG "+o.xg[0]+" - "+o.xg[1]+"  (estimado)";else xg.textContent="";
document.getElementById("ds").textContent=o.ds||"";
document.getElementById("ps").textContent=o.ps||"";
var m=parseFloat(o.mom)||0,w=Math.min(50,Math.abs(m)*50);
if(m>0){mbb.style.left=(50-w)+"%";}else{mbb.style.left="50%";}
mbb.style.width=w+"%";
mbt.textContent=Math.abs(m)<0.12?"MOMENTO  ·  igualado":("MOMENTO  ·  "+(m>0?o.h:o.a)+" empuja");
var gs=o.goles||[],h="";
for(var i=0;i<gs.length;i++){h+="<div>"+gs[i].m+"  "+gs[i].t+"</div>";}
gl.innerHTML=h;
tp.textContent=o.fig?("★ "+o.fig.join("   ")):(o.ult?("› "+o.ult):"");
var rmH=(o.rm==="h");
var rmS=parseInt(rmH?o.hs:o.as,10)||0, rvS=parseInt(rmH?o.as:o.hs,10)||0;
if(pRM!==null&&o.state!=="pre"){
 if(rmS>pRM){var gg=null;
  for(var i=gs.length-1;i>=0;i--){if(gs[i].rm===true){gg=gs[i];break;}}
  if(!gg)gg={t:"Real Madrid",m:o.min||""};
  cele(gg);grito(gg.p||"",1);armar(o.clip);
  if(CLIP)setTimeout(abrirVideo,7500);else vigilaClip();
 }else if(rvS>pRV){bannerRival(rmH?o.a:o.h,o.min||"",(o.hs+"-"+o.as));}
}
pRM=rmS;pRV=rvS;
}
function J(u){return fetch(u,{cache:"no-store"}).then(function(r){return r.json();});}
function pc(v){var f=parseFloat(v);if(isNaN(f))return "-";return (f<=1?Math.round(f*100):Math.round(f))+"%";}
function num(v){var f=parseFloat(String(v).replace("%",""));return isNaN(f)?0:f;}
var LI=["esp.1","uefa.champions","esp.copa_del_rey","esp.super_cup","uefa.super_cup","fifa.cwc"];
var SB="https://site.api.espn.com/apis/site/v2/sports/soccer/";
function horaLocal(iso){try{var d=new Date(iso);return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}catch(e){return "";}}
function fechaLocal(iso){try{var d=new Date(iso),D=["dom","lun","mar","mie","jue","vie","sab"];
 return D[d.getDay()]+" "+d.getDate()+" "+("0"+(d.getMonth()+1)).slice(-2)+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}catch(e){return "";}}
function momento(v){
 try{var now=Date.now(),a=JSON.parse(localStorage.getItem("mom")||"[]");
  a.push([now,v]);a=a.filter(function(x){return now-x[0]<300000;});
  localStorage.setItem("mom",JSON.stringify(a));
  if(a.length<2)return 0;
  var dt=Math.max(1,(a[a.length-1][0]-a[0][0])/60000);
  var d=(a[a.length-1][1]-a[0][1])/dt;
  return Math.max(-1,Math.min(1,d/2));}catch(e){return 0;}}
function calScan(){
 var hoy=new Date(),ps=[],L2=["esp.1","uefa.champions"];
 for(var i=0;i<16;i++){
  var d=new Date(hoy.getTime()+i*86400000);
  var ds=d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);
  for(var j=0;j<L2.length;j++){(function(lg,dt){
   ps.push(J(SB+lg+"/scoreboard?dates="+dt).then(function(r){
    var out=[];((r.events)||[]).forEach(function(e){if(/Real Madrid/.test(e.name||""))out.push({n:e.name,d:e.date});});
    return out;
   }).catch(function(){return [];}));
  })(L2[j],ds);}
 }
 return Promise.all(ps).then(function(a){var all=[];a.forEach(function(x){all=all.concat(x);});
  all.sort(function(x,y){return x.d<y.d?-1:1;});return all.slice(0,6);});
}
function evtTxt(t){
 var s=String(t||"");
 var m=s.match(/^(.+?)\s*(?:\(([^)]+)\))?\s*is shown the (Yellow|Red|Second Yellow)/i);
 if(m){var c=/second/i.test(m[3])?"Doble amarilla":(/red/i.test(m[3])?"Roja":"Amarilla");return c+" · "+m[1];}

 s=s.replace(/^Substitution,\s*/i,"Cambio · ").replace(/\s*replaces\s*/i," por ");
 s=s.replace(/Yellow card/gi,"Amarilla").replace(/Red card/gi,"Roja").replace(/Second yellow/gi,"Doble amarilla");
 s=s.replace(/Penalty/gi,"Penalti").replace(/Own goal/gi,"Propia puerta").replace(/\.$/,"");
 return s;
}
function listaHtml(l){
 var h="";
 for(var i=0;i<l.length&&i<4;i++){h+="<div>"+fechaLocal(l[i].d)+"  "+String(l[i].n).replace(" at "," – ")+"</div>";}
 return h;
}
function prox(){
 var c=null;try{c=JSON.parse(localStorage.getItem("cal")||"null");}catch(e){}
 if(c&&Date.now()-c.t<21600000&&c.l&&c.l.length)return Promise.resolve({ok:false,prox:c.l[0].n,proxf:fechaLocal(c.l[0].d),lista:c.l});
 return J(SB+"esp.1/teams/86").then(function(d){
  var ne=(d.team&&d.team.nextEvent)||[],base={ok:false};
  if(ne.length){base.prox=ne[0].name;base.proxf=fechaLocal(ne[0].date);}
  calScan().then(function(l){
   if(!l.length)return;
   try{localStorage.setItem("cal",JSON.stringify({t:Date.now(),l:l}));}catch(e){}
   sc.innerHTML="PRÓXIMOS<i>"+fechaLocal(l[0].d)+"</i>";
   gl.innerHTML=listaHtml(l);tp.textContent="";
  });
  return base;
 }).catch(function(){return {ok:false};});
}
function monta(lg,e,s){
 var c=(e.competitions||[])[0]||{},comp=c.competitors||[],H=null,A=null;
 for(var i=0;i<comp.length;i++){if(comp[i].homeAway==="home")H=comp[i];else A=comp[i];}
 if(!H||!A)return {ok:false};
 var bt=(s.boxscore&&s.boxscore.teams)||[],th=null,ta=null;
 for(var i=0;i<bt.length;i++){if(bt[i].homeAway==="home")th=bt[i];else ta=bt[i];}
 function g(t,n){if(!t||!t.statistics)return "-";
  for(var i=0;i<t.statistics.length;i++){if(t.statistics[i].name===n)return t.statistics[i].displayValue;}return "-";}
 var ty=(e.status&&e.status.type)||{};
 var o={ok:true,state:ty.state||"pre",det:ty.shortDetail||"",h:H.team.abbreviation,a:A.team.abbreviation,
  hs:String(H.score||0),as:String(A.score||0),rm:(A.team.displayName==="Real Madrid")?"a":"h",
  pos:[g(th,"possessionPct"),g(ta,"possessionPct")],
  tiros:[g(th,"totalShots"),g(ta,"totalShots")],
  apuerta:[g(th,"shotsOnTarget"),g(ta,"shotsOnTarget")],
  corners:[g(th,"wonCorners"),g(ta,"wonCorners")],
  goles:[],fig:null};
 var xh=num(o.apuerta[0])*0.32+Math.max(0,num(o.tiros[0])-num(o.apuerta[0]))*0.05+num(o.corners[0])*0.015;
 var xa=num(o.apuerta[1])*0.32+Math.max(0,num(o.tiros[1])-num(o.apuerta[1]))*0.05+num(o.corners[1])*0.015;
 o.xg=[xh.toFixed(2),xa.toFixed(2)];
 o.mom=momento(num(o.tiros[0])+2*num(o.apuerta[0])+num(o.corners[0]));
 o.ds="Faltas "+g(th,"foulsCommitted")+"-"+g(ta,"foulsCommitted")+" · Amarillas "+g(th,"yellowCards")+"-"+g(ta,"yellowCards")+" · Paradas "+g(th,"saves")+"-"+g(ta,"saves");
 o.ps="Pases "+g(th,"totalPasses")+"-"+g(ta,"totalPasses")+" · Precisión "+pc(g(th,"passPct"))+"-"+pc(g(ta,"passPct"));
 o.ult="";
 var ke=s.keyEvents||[];
 for(var i=0;i<ke.length;i++){var k=ke[i];if(!k.scoringPlay)continue;
  var tx=k.text||"",pl="",mm=tx.match(/\.\s*([^(]+)\(/);
  if(mm)pl=mm[1].trim();
  var eq=(k.team&&k.team.displayName)||"";
  o.goles.push({m:(k.clock&&k.clock.displayValue)||"",t:pl+" · "+(eq===H.team.displayName?H.team.abbreviation:A.team.abbreviation),p:pl,rm:(eq==="Real Madrid")});
 }
 var x1="",x2="";
 for(var i2=ke.length-1;i2>=0;i2--){var k2=ke[i2];if(k2.scoringPlay)continue;var t2=evtTxt(k2.text||"");if(t2.length<8)continue;
  if(/^(Delay|End of|Second Half|First Half|Start|Kick|Match ends)/i.test(t2))continue;
  if(/^Cambio/.test(t2)){if(!x2)x2=t2;}else{if(!x1)x1=t2;}
  if(x1)break;}
 o.ult=(x1||x2); if(o.ult.length>58)o.ult=o.ult.slice(0,o.ult.lastIndexOf(" ",56))+"…";
 EVID=e.id;LGA=lg;
 var vv=(s.videos||[]);
 if(vv.length){var lk=vv[0].links||{};var mp=(lk.mobile&&lk.mobile.source&&lk.mobile.source.href)||(lk.source&&lk.source.href)||"";if(mp)o.clip=mp;}
 if(o.state==="pre")o.hora=horaLocal(e.date);
 return o;
}
function datos(){
 var i=0;
 function paso(){
  if(i>=LI.length)return prox();
  var lg=LI[i++];
  return J(SB+lg+"/scoreboard").then(function(d){
   var ev=(d.events||[]).filter(function(x){return /Real Madrid/.test(x.name||"");});
   if(!ev.length)return paso();
   var e=null;
   for(var j=0;j<ev.length;j++){var st=((ev[j].status||{}).type||{}).state;if(st!=="post"){e=ev[j];break;}}
   if(!e)e=ev[ev.length-1];
   return J(SB+lg+"/summary?event="+e.id).then(function(s){return monta(lg,e,s);});
  }).catch(paso);
 }
 return paso();
}
function tick(){
 if(FORCE){pinta(demoObj());return;}
 datos().then(function(o){pinta(o);}).catch(function(){});
}

var VT=null;
function ver(){
 var w=document.getElementById("w");
 w.style.display="block";
 if(VT)clearTimeout(VT);
 VT=setTimeout(ocultar,10000);
 tick();
}
function ocultar(){document.getElementById("w").style.display="none";}
var EVID="",LGA="esp.1",GOLTS=0,VIG=null;
function vigilaClip(){
 if(VIG)clearInterval(VIG);
 var hasta=Date.now()+15*60000;
 VIG=setInterval(function(){
  if(Date.now()>hasta){clearInterval(VIG);VIG=null;return;}
  if(!EVID)return;
  J(SB+LGA+"/summary?event="+EVID).then(function(s){
   var v0=(s.videos||[])[0]; if(!v0)return;
   var lk=v0.links||{};
   var h=(lk.mobile&&lk.mobile.source&&lk.mobile.source.href)||(lk.source&&lk.source.href)||"";
   if(!h||h===CLIP)return;
   var pd=Date.parse(v0.originalPublishDate||"")||0;
   if(pd&&GOLTS&&pd<GOLTS-180000)return;
   armar(h);abrirVideo();clearInterval(VIG);VIG=null;
  }).catch(function(){});
 },40000);
}
function abrirVideo(){
 if(!CLIP)return;
 var d=document.getElementById("vid"),v=document.getElementById("v");
 if(v.getAttribute("src")!==CLIP){v.setAttribute("src",CLIP);}
 d.style.display="flex";VAB=true;
 v.muted=false;v.volume=1;
 try{v.currentTime=0;v.play();}catch(e){}
}
function cerrarVideo(){
 var d=document.getElementById("vid"),v=document.getElementById("v");
 try{v.pause();}catch(e){}
 d.style.display="none";VAB=false;
}
(function(){var v0=document.getElementById("v");
 if(v0)v0.addEventListener("ended",function(){cerrarVideo();ver();});
})();
var RVQ=(location.search.match(/[?&]rival=([^&]+)/)||[])[1];
if(RVQ){var rp=decodeURIComponent(RVQ).split(/[|,]/);setTimeout(function(){bannerRival(rp[0],rp[1],rp[2]);},700);}
var CQ=(location.search.match(/[?&]clip=([^&]+)/)||[])[1];
if(CQ==="vig"){setTimeout(vigilaClip,1500);}else if(CQ){armar(decodeURIComponent(CQ));setTimeout(abrirVideo,3000);}
window.NEO_TAP=function(){
 if(VAB){cerrarVideo();return;}
 if(CLIP&&Date.now()-CT<180000){abrirVideo();return;}
 ver();
};

var GOLQ=/gol=1/.test(location.search);
var GOLN=decodeURIComponent((location.search.match(/[?&]n=([^&]*)/)||["",""])[1]||"");
if(GOLQ){setTimeout(function(){cele({t:GOLN||"Real Madrid",m:""});},700);}
ver();setInterval(function(){var w=document.getElementById("w");if(w.style.display!=="none")tick();},12000);
</script></body></html>
