<!DOCTYPE html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>T-800</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:"SF Mono",Menlo,Consolas,monospace;color:#ff2d2d;
 -webkit-font-smoothing:none;text-shadow:0 0 6px rgba(255,45,45,.55),0 1px 3px #000}
#scan{position:fixed;inset:0;pointer-events:none;z-index:9;
 background:repeating-linear-gradient(0deg,rgba(255,0,0,.05) 0 1px,transparent 1px 3px)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:8;
 background:transparent}
#sweep{position:fixed;left:0;right:0;height:70px;z-index:7;pointer-events:none;
 background:linear-gradient(180deg,transparent,rgba(255,40,40,.13),transparent);
 animation:sw 5s linear infinite;opacity:.9}
@keyframes sw{0%{top:-80px}100%{top:640px}}
#w{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 12px;z-index:5;
 opacity:0;transition:opacity .25s}
#w.on{opacity:1}
#top{display:flex;justify-content:space-between;font-size:9px;letter-spacing:2px;opacity:.85}
#ret{position:relative;height:132px;margin:2px 0 0;display:flex;align-items:center;justify-content:center}
.br{position:absolute;width:16px;height:16px;border:1px solid #ff2d2d;opacity:.75}
#b1{top:6px;left:34px;border-right:0;border-bottom:0}
#b2{top:6px;right:34px;border-left:0;border-bottom:0}
#b3{bottom:6px;left:34px;border-right:0;border-top:0}
#b4{bottom:6px;right:34px;border-left:0;border-top:0}
#cr{position:relative;width:74px;height:74px;border:1px solid rgba(255,45,45,.5);border-radius:50%}
#cr:before,#cr:after{content:"";position:absolute;background:#ff2d2d}
#cr:before{left:50%;top:-14px;width:1px;height:102px;opacity:.6}
#cr:after{top:50%;left:-14px;height:1px;width:102px;opacity:.6}
#dot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;
 background:#ff2d2d;border-radius:50%;box-shadow:0 0 8px #ff2d2d}
#sector{position:absolute;bottom:-4px;left:0;right:0;text-align:center;font-size:15px;
 letter-spacing:5px;font-weight:700}
#sub{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:8px;
 letter-spacing:2px;opacity:.6}
</style></head><body>
<style>
#dat{margin-top:16px;flex:1;overflow:hidden}
.ln{display:flex;font-size:10px;letter-spacing:1.4px;padding:2.5px 0;
 border-bottom:1px solid rgba(255,45,45,.13)}
.ln b{width:86px;font-weight:400;opacity:.62}
.ln span{flex:1;text-align:right;font-weight:700;white-space:nowrap;overflow:hidden}
.ln.hi span{color:#ff6b6b;text-shadow:0 0 10px rgba(255,60,60,.8)}
#log{margin-top:6px;font-size:9px;letter-spacing:1.6px;opacity:.85;white-space:nowrap;overflow:hidden}
@keyframes bl{50%{opacity:0}}
#cur{animation:bl 1s steps(1) infinite}
@keyframes fl{0%,97%,100%{opacity:1}98%{opacity:.55}}
#w.on{animation:fl 7s infinite}
</style>
<div id="vig"></div><div id="sweep"></div><div id="scan"></div>
<div id="w">
 <div id="top"><span>CYBERDYNE // NEO-7</span><span id="hora">--:--:--</span></div>
 <div id="ret">
  <div class="br" id="b1"></div><div class="br" id="b2"></div>
  <div class="br" id="b3"></div><div class="br" id="b4"></div>
  <div id="cr"><div id="dot"></div></div>
  <div id="sector">· · ·</div>
  <div id="sub">ESCANEANDO ENTORNO</div>
 </div>
 <div id="dat"></div>
 <div id="log">› ENLACE ACTIVO<span id="cur">_</span></div>
</div><script>
var $=function(i){return document.getElementById(i)},GEO=null;
window.NEO_GEO=function(la,lo,ac){GEO={lat:la,lon:lo,a:ac||0}};
function reloj(){
 var d=new Date(),h=("0"+d.getHours()).slice(-2),m=("0"+d.getMinutes()).slice(-2),s=("0"+d.getSeconds()).slice(-2);
 $("hora").textContent=h+":"+m+":"+s;
}
setInterval(reloj,1000);reloj();
function ln(k,v,hi){return '<div class="ln'+(hi?' hi':'')+'"><b>'+k+'</b><span>'+v+'</span></div>'}
function fase(d){
 var y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();
 if(m<3){y--;m+=12}
 var a=Math.floor(y/100),b=2-a+Math.floor(a/4),j=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+dd+b-1524;
 var f=(j-2451550.1)/29.530588853;f=f-Math.floor(f);
 var il=Math.round(f*100);
 var n=f<.03?"NUEVA":f<.22?"CRECIENTE":f<.28?"CUARTO CRECIENTE":f<.47?"GIBOSA":f<.53?"LLENA":f<.72?"GIBOSA MENG.":f<.78?"CUARTO MENG.":"MENGUANTE";
 return n+" "+il+"%";
}
function wt(c){
 var m={0:"DESPEJADO",1:"MAYORMENTE DESPEJADO",2:"PARCIAL",3:"NUBLADO",45:"NIEBLA",48:"NIEBLA HELADA",51:"LLOVIZNA",53:"LLOVIZNA",55:"LLOVIZNA FUERTE",61:"LLUVIA",63:"LLUVIA",65:"LLUVIA FUERTE",71:"NIEVE",73:"NIEVE",75:"NIEVE FUERTE",80:"CHUBASCOS",81:"CHUBASCOS",82:"CHUBASCOS FUERTES",95:"TORMENTA",96:"TORMENTA",99:"TORMENTA"};
 return m[c]||"";
}
function dir(x){var d=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSO","SO","OSO","O","ONO","NO","NNO"];return d[Math.round(((x||0)%360)/22.5)%16]}
function hh(s){if(!s)return "--:--";var d=new Date(s);return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)}
async function datos(){
 var t0=performance.now();
 var ip={};
 try{ip=await fetch("https://ipwho.is/",{cache:"no-store"}).then(function(r){return r.json()})}catch(e){}
 var la=(GEO&&GEO.lat)||ip.latitude||40.13, lo=(GEO&&GEO.lon)||ip.longitude||-3.85;
 var nom=null;
 try{nom=await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+la+"&longitude="+lo+"&localityLanguage=es",{cache:"no-store"}).then(function(r){return r.json()})}catch(e){}
 var city=(nom&&(nom.city||nom.locality))||ip.city||"DESCONOCIDO";
 $("sector").textContent=String(city).toUpperCase();
 $("sub").textContent=(GEO?"POSICION REAL":"ESTIMADA POR RED")+" · "+(nom&&nom.principalSubdivision?nom.principalSubdivision.toUpperCase():"");
 var U1="https://api.open-meteo.com/v1/forecast?latitude="+la+"&longitude="+lo+"&current=temperature_2m,wind_speed_10m,wind_direction_10m,relative_humidity_2m,is_day,weather_code&daily=sunrise,sunset&timezone=auto&forecast_days=1";
 var U2="https://air-quality-api.open-meteo.com/v1/air-quality?latitude="+la+"&longitude="+lo+"&current=european_aqi,pm2_5";
 var U3="https://api.open-meteo.com/v1/elevation?latitude="+la+"&longitude="+lo;
 var r=await Promise.all([
  fetch(U1,{cache:"no-store"}).then(function(x){return x.json()}).catch(function(){return {}}),
  fetch(U2,{cache:"no-store"}).then(function(x){return x.json()}).catch(function(){return {}}),
  fetch(U3,{cache:"no-store"}).then(function(x){return x.json()}).catch(function(){return {}})
 ]);
 var me=r[0]||{},aq=r[1]||{},el=r[2]||{},c=me.current||{},d=me.daily||{},a=aq.current||{};
 var alt=(el.elevation&&el.elevation[0])?Math.round(el.elevation[0]):"--";
 var out="";
 out+=ln("COORD",Math.abs(la).toFixed(4)+(la>=0?"N ":"S ")+Math.abs(lo).toFixed(4)+(lo>=0?"E":"O"));
 out+=ln("ALTITUD",alt+" M");
 out+=ln("TEMP",(c.temperature_2m==null?"--":Math.round(c.temperature_2m)+"°")+" / "+wt(c.weather_code));
 out+=ln("VIENTO",(c.wind_speed_10m==null?"--":Math.round(c.wind_speed_10m)+" KM/H "+dir(c.wind_direction_10m)));
 out+=ln("HUMEDAD",(c.relative_humidity_2m==null?"--":Math.round(c.relative_humidity_2m)+" %"));
 var q=a.european_aqi;
 out+=ln("AIRE",(q==null?"--":Math.round(q)+" AQI · PM2.5 "+Math.round(a.pm2_5||0)),q>60);
 out+=ln("LUZ","↑"+hh(d.sunrise&&d.sunrise[0])+"  ↓"+hh(d.sunset&&d.sunset[0]));
 out+=ln("LUNA",fase(new Date()));
 try{
  var g=await fetch("https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&latitude="+la+"&longitude="+lo+"&maxradiuskm=400&limit=1&orderby=time&minmagnitude=1",{cache:"no-store"}).then(function(x){return x.json()});
  var f=(g.features||[])[0];
  if(!f){out+=ln("SISMO","NINGUNO EN 400 KM")}
  else{
   var q2=f.geometry.coordinates, dy=(q2[1]-la)*111, dx=(q2[0]-lo)*111*Math.cos(la*Math.PI/180);
   out+=ln("SISMO","M"+f.properties.mag+" · "+Math.round(Math.sqrt(dx*dx+dy*dy))+" KM · "+Math.round((Date.now()-f.properties.time)/3600000)+" H",f.properties.mag>=3);
  }
 }catch(e){out+=ln("SISMO","SIN DATO")}
 try{
  var s=await fetch("https://api.wheretheiss.at/v1/satellites/25544",{cache:"no-store"}).then(function(x){return x.json()});
  var dy2=(s.latitude-la)*111, dx2=(s.longitude-lo)*111*Math.cos(la*Math.PI/180), di=Math.sqrt(dx2*dx2+dy2*dy2);
  out+=ln("ISS",Math.round(s.altitude)+" KM ALT · "+(di<400?"SOBRE TI":"A "+Math.round(di)+" KM"),di<900);
 }catch(e){out+=ln("ISS","SIN DATO")}
 $("dat").innerHTML=out;
 $("log").innerHTML="› ENLACE ACTIVO · "+Math.round(performance.now()-t0)+" MS<span id=cur>_</span>";
 $("w").classList.add("on");
}
function tap(){$("w").classList.toggle("on");if($("w").classList.contains("on"))datos()}
window.NEO_TAP=tap;
setTimeout(function(){$("w").classList.add("on")},120);
datos();
</script></body></html>
